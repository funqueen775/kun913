openapi: 3.0.3
info:
  title: Workplace Town API
  version: 1.0.0-draft
  description: Shared contract for the Godot prototype, Harmony shell, and assessment backend.
servers:
  - url: https://api.example.com/api/v1
paths:
  /health:
    get:
      summary: Check service availability
      responses:
        '200':
          description: Service is ready
  /sessions:
    post:
      summary: Create or resume an assessment session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resumeSessionId: { type: string }
                contentVersion: { type: string, example: v1 }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
  /sessions/{sessionId}:
    get:
      summary: Read the authoritative session state
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
  /sessions/{sessionId}/next:
    get:
      summary: Get the next story node or free activity
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200':
          description: A playable node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextResponse' }
  /sessions/{sessionId}/events:
    post:
      summary: Record one player event idempotently
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerEvent' }
      responses:
        '200':
          description: Event accepted or previous result returned for same eventId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '409': { description: Event conflicts with current story state }
  /sessions/{sessionId}/npcs/{npcId}/memories:
    get:
      summary: List what an NPC remembers about the player (memory wall / dialogue context)
      description: >
        Deterministic projection of the session event stream, grouped by memory layer
        (fact / relation / state / social, see the game-mechanics doc §5.2).
        Read-only: memories are derived from events, never stored or mutated separately.
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/NpcId' }
        - name: layers
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [fact, relation, state, social] }
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Memory items, newest seq first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NpcMemoriesResponse' }
  /sessions/{sessionId}/npcs/{npcId}/chat:
    post:
      summary: Free casual chat with an NPC (companionship only, never assessment evidence)
      description: >
        Idempotent by eventId like every event. The backend assembles memory context,
        then replies with a template (always available) or an LLM-polished variant.
        Chat content is stored in the game-memory stream only and must never reach the
        assessment evidence store (anti-pollution rule, mechanics doc §10).
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/NpcId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Reply accepted or previous reply returned for the same eventId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '404': { description: Unknown npcId for this session }
  /sessions/{sessionId}/messages:
    get:
      summary: List proactive NPC messages (inbox)
      description: >
        Produced by the trigger scheduler (state / relation / story / memory triggers,
        mechanics doc §5.3) after settlement or event submission. Cooldowns and the
        per-month priority cap are already applied server-side; the client only renders.
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Messages, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NpcMessagesResponse' }
  /sessions/{sessionId}/messages/{messageId}/read:
    post:
      summary: Mark one proactive message as read
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Marked as read }
  /sessions/{sessionId}/report:
    post:
      summary: Generate the final report after required story nodes are complete
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '202': { description: Report generation requested }
    get:
      summary: Read a generated report
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200':
          description: Report ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NpcId:
      name: npcId
      in: path
      required: true
      schema: { type: string, example: wang_ge }
      description: Stable NPC id from data/town/npcs.json (wang_ge / chen_gong / xiao_lin / lao_zhou / xiao_zhao)
  schemas:
    SessionState:
      type: object
      required: [chapterId, currentNodeId, unlockedRegionIds, energy, scoreSummary]
      properties:
        chapterId: { type: string, example: M1 }
        currentNodeId: { type: string, example: M1-E01 }
        completedStoryIds: { type: array, items: { type: string } }
        completedActivityIds: { type: array, items: { type: string } }
        unlockedRegionIds:
          type: array
          items: { type: string, enum: [A, B, C, D, E, F, G, H] }
        energy: { type: integer, minimum: 0, maximum: 100 }
        npcAffinity: { type: object, additionalProperties: { type: integer } }
        npcRelationStage:
          type: object
          description: Relation stage per NPC (mechanics doc §5.4); NPCs without a relation system are absent
          additionalProperties:
            type: string
            enum: [Lv1, Lv2, Lv3, Lv4, Lv5]
        flags: { type: object, additionalProperties: true }
        scoreSummary: { type: object, additionalProperties: { type: number } }
        scoringVersion: { type: string, example: v1 }
    SessionResponse:
      type: object
      required: [sessionId, contentVersion, state]
      properties:
        sessionId: { type: string, format: uuid }
        contentVersion: { type: string, example: v1 }
        state: { $ref: '#/components/schemas/SessionState' }
    PlayerEvent:
      type: object
      required: [eventId, eventType, contentVersion, clientTime, payload]
      properties:
        eventId: { type: string, format: uuid }
        eventType:
          type: string
          enum: [region_entered, main_choice, free_activity, npc_dialogue_complete]
        contentVersion: { type: string, example: v1 }
        clientTime: { type: string, format: date-time }
        durationSeconds: { type: integer, minimum: 0 }
        payload:
          type: object
          required: [regionId]
          properties:
            regionId: { type: string, enum: [A, B, C, D, E, F, G, H] }
            storyId: { type: string, example: M1-E01 }
            activityId: { type: string, example: S1 }
            choiceId: { type: string, example: M1-E01-C02 }
    EventResponse:
      type: object
      required: [eventId, accepted, state]
      properties:
        eventId: { type: string, format: uuid }
        accepted: { type: boolean }
        duplicate: { type: boolean }
        state: { $ref: '#/components/schemas/SessionState' }
        nextNodeId: { type: string, nullable: true }
    NextResponse:
      type: object
      required: [nodeId, nodeType, regionId, title]
      properties:
        nodeId: { type: string, example: M1-E01 }
        nodeType: { type: string, enum: [main_story, free_activity, finished] }
        regionId: { type: string, enum: [A, B, C, D, E, F, G, H] }
        title: { type: string }
        body: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [choiceId, text]
            properties:
              choiceId: { type: string }
              text: { type: string }
    Report:
      type: object
      required: [sessionId, scoringVersion, dimensions, generatedAt]
      properties:
        sessionId: { type: string, format: uuid }
        scoringVersion: { type: string, example: v1 }
        generatedAt: { type: string, format: date-time }
        dimensions: { type: object, additionalProperties: { type: number } }
        summary: { type: string }
        evidence: { type: array, items: { type: object } }
    MemoryRef:
      type: object
      description: >
        Reference to one event a memory was derived from, so any NPC line can be
        replayed. `storyId` is an opaque string: the mapping between contract story
        ids and engine event keys stays inside the backend.
      required: [eventId, month, layer, fact]
      properties:
        eventId: { type: string, format: uuid }
        seq: { type: integer, minimum: 0 }
        month: { type: integer, minimum: 1, maximum: 48 }
        storyId: { type: string, nullable: true }
        layer: { type: string, enum: [fact, relation, state, social] }
        tag: { type: string, nullable: true }
        fact: { type: string }
    NpcMemory:
      type: object
      required: [npcId, layer, kind, month, fact, eventRef]
      properties:
        npcId: { type: string }
        layer: { type: string, enum: [fact, relation, state, social] }
        kind: { type: string, example: promise }
        month: { type: integer, minimum: 1, maximum: 48 }
        fact: { type: string }
        eventRef: { type: string, format: uuid }
        seq: { type: integer, minimum: 0 }
    NpcMemoriesResponse:
      type: object
      required: [npcId, relationStage, items]
      properties:
        npcId: { type: string }
        relationStage: { type: string, enum: [Lv1, Lv2, Lv3, Lv4, Lv5] }
        items:
          type: array
          items: { $ref: '#/components/schemas/NpcMemory' }
    ChatRequest:
      type: object
      required: [eventId, contentVersion, clientTime, text]
      properties:
        eventId: { type: string, format: uuid }
        contentVersion: { type: string, example: v1 }
        clientTime: { type: string, format: date-time }
        text:
          type: string
          minLength: 1
          maxLength: 500
    ChatResponse:
      type: object
      required: [eventId, reply, generatedBy, memoryRefs, relationStage]
      properties:
        eventId: { type: string, format: uuid }
        reply: { type: string }
        generatedBy:
          type: string
          enum: [template, llm]
          description: template = deterministic fallback; llm = polished wording, facts unchanged
        memoryRefs:
          type: array
          items: { $ref: '#/components/schemas/MemoryRef' }
        relationStage: { type: string, enum: [Lv1, Lv2, Lv3, Lv4, Lv5] }
    NpcMessage:
      type: object
      required: [messageId, npcId, kind, title, body, month, memoryRefs, priority, read]
      properties:
        messageId: { type: string }
        npcId: { type: string }
        kind:
          type: string
          enum: [state, relation, story, memory]
        title: { type: string }
        body: { type: string }
        month: { type: integer, minimum: 1, maximum: 48 }
        memoryRefs:
          type: array
          items: { $ref: '#/components/schemas/MemoryRef' }
        priority: { type: integer, minimum: 0 }
        read: { type: boolean }
    NpcMessagesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NpcMessage' }
